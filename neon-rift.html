<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050b"><title>NEON RIFT</title><link rel="stylesheet" href="neon-rift.css"></head><body><div class="nr-app"><header class="nr-top"><div class="nr-brand"><div class="nr-logo">NR</div><div class="nr-title"><h1>NEON RIFT</h1><p>Neon arcade survival • cross-platform</p></div></div><div class="nr-toolbar"><button class="nr-btn" id="audioBtn">🔊 Audio</button><button class="nr-btn" id="fullscreenBtn">⛶ Fullscreen</button></div></header><main class="nr-stage"><section class="nr-game-card"><canvas class="nr-canvas" id="gameCanvas"></canvas><div class="nr-hud"><div class="nr-chip" id="deviceMode">Detecting controls…</div><div class="nr-chip" id="scoreHud">SCORE 0</div></div><div class="nr-menu" id="menu"><div class="nr-menu-card"><div class="nr-logo" style="margin:0 auto 12px">NR</div><h2>NEON RIFT</h2><p>Dodge, fire and survive the neon storm. Solo mode is fully offline. Multiplayer layers are designed to plug in without changing the core game.</p><div class="nr-mode-grid"><button class="nr-mode" id="soloBtn"><strong>◉</strong>SOLO<small>Offline</small></button><button class="nr-mode" id="lanBtn"><strong>⌁</strong>LAN<small>Ready layer</small></button><button class="nr-mode" id="onlineBtn"><strong>◎</strong>ONLINE<small>Ready layer</small></button></div><div class="nr-status" id="status">Choose a mode to begin.</div></div></div><div class="nr-controls-touch" id="touchControls"><div class="nr-joy" id="joystick"><div class="nr-stick" id="stick"></div></div><button class="nr-fire" id="fireBtn">FIRE</button></div><div class="nr-game-over nr-hidden" id="gameOver"><div class="nr-result"><h2>RIFT COLLAPSED</h2><p id="resultText">Score 0</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="nr-primary" id="retryBtn">Retry</button><button class="nr-secondary" id="menuBtn">Menu</button></div></div></div></section></main></div><script type="module">import{NeonRiftEngine,detectInputMode,GAME}from'./neon-rift.js';
const $=id=>document.getElementById(id);const canvas=$('gameCanvas');const engine=new NeonRiftEngine(canvas);let input=detectInputMode();$('deviceMode').textContent=input==='desktop'?'⌨️ Desktop controls':input==='touch'?'📱 Touch controls':'🔀 Hybrid controls';let audioOn=true,started=false;
const audio=()=>{if(!audioOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=window.__nrAudio||(window.__nrAudio=new A());if(c.state==='suspended')c.resume() ;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=540;g.gain.value=.018;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.07)}catch{}};
function start(mode){started=true;$('menu').classList.add('nr-hidden');$('gameOver').classList.add('nr-hidden');$('status').textContent=`${mode} mode`;engine.score=0;engine.player.hp=100;engine.elapsed=0;engine.enemies=[];engine.projectiles=[];engine.particles=[];engine.control={x:0,y:0,fire:false};engine.stop();engine.start();audio();}
$('soloBtn').onclick=()=>start('Solo Offline');$('lanBtn').onclick=()=>{$('status').textContent='LAN mode scaffold ready — networking layer comes next.';audio()};$('onlineBtn').onclick=()=>{$('status').textContent='Online mode scaffold ready — authoritative server layer comes next.';audio()};$('retryBtn').onclick=()=>start('Solo Offline');$('menuBtn').onclick=()=>{engine.stop();started=false;$('gameOver').classList.add('nr-hidden');$('menu').classList.remove('nr-hidden')};$('audioBtn').onclick=()=>{audioOn=!audioOn;$('audioBtn').textContent=audioOn?'🔊 Audio':'🔇 Audio'};$('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
function keyboard(){if(input==='touch')return;const k={};addEventListener('keydown',e=>{k[e.key.toLowerCase()]=true;if(e.key===' ')engine.control.fire=true});addEventListener('keyup',e=>{k[e.key.toLowerCase()]=false;if(e.key===' ')engine.control.fire=false});setInterval(()=>{let x=0,y=0;if(k.w||k.arrowup)y-=1;if(k.s||k.arrowdown)y+=1;if(k.a||k.arrowleft)x-=1;if(k.d||k.arrowright)x+=1;const m=Math.hypot(x,y)||1;engine.control.x=x/m;engine.control.y=y/m},30)}keyboard();
const joy=$('joystick'),stick=$('stick');let joyId=null;function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,dist=Math.min(max,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),x=Math.cos(a)*dist,y=Math.sin(a)*dist;stick.style.transform=`translate(${x}px,${y}px)`;engine.control.x=x/max;engine.control.y=y/max}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,()=>{joyId=null;stick.style.transform='translate(0,0)';engine.control.x=0;engine.control.y=0}));$('fireBtn').addEventListener('pointerdown',e=>{engine.control.fire=true;audio();try{navigator.vibrate?.(10)}catch{}});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fireBtn').addEventListener(ev,()=>engine.control.fire=false));
setInterval(()=>{$('scoreHud').textContent=`SCORE ${engine.score} • HP ${engine.player.hp}`;if(started&&engine.player.hp<=0){engine.stop();$('gameOver').classList.remove('nr-hidden');$('resultText').textContent=`Score ${engine.score} • ${Math.floor(engine.elapsed)}s survived`;try{navigator.vibrate?.([40,30,80])}catch{}}},100);
</script></body></html>
