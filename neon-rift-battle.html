<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070b"><title>NEON RIFT — Battlefield</title><link rel="stylesheet" href="neon-rift-battle.css?v=2"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">NR</div><div><h1>NEON RIFT</h1><small>Battlefield</small></div></div><div class="toolbar"><button class="btn" id="sound" type="button">🔊 Sound</button><button class="btn" id="fs" type="button">⛶ Fullscreen</button></div></header><main class="stage"><section class="game"><canvas id="canvas" class="canvas"></canvas><div class="hud"><div class="chip" id="modeHud">MENU</div><div class="chip" id="stats">KILLS 0 • SCORE 0</div></div><div class="menu" id="menu"><div class="menu-card"><div class="logo" style="margin:0 auto 12px">NR</div><h2>NEON RIFT</h2><p>2D battlefield combat with jetpack movement, weapons, grenades and AI enemies.</p><div class="modes"><button type="button" class="mode" data-mode="training"><b>🎯</b>Training<small>Practice vs AI</small></button><button type="button" class="mode" data-mode="survival"><b>💀</b>Survival<small>AI waves</small></button><button type="button" class="mode" data-mode="deathmatch"><b>⚔️</b>Deathmatch<small>Battlefield AI</small></button></div><div class="modes" style="grid-template-columns:1fr 1fr;margin-top:10px"><button type="button" class="mode" id="hostBtn"><b>📡</b>Create Room<small>LAN / Online</small></button><button type="button" class="mode" id="joinBtn"><b>🔗</b>Join Room<small>Enter room code</small></button></div><div class="status" id="status">Choose a mode to begin.</div><p style="font-size:11px">PC: WASD / arrows + mouse + Space + G • Phone: joystick + JET + FIRE + grenade</p></div></div><div class="touch" id="touch"><div class="stick-zone" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button type="button" class="action" id="jet">JET</button><button type="button" class="action" id="grenade">💣</button><button type="button" class="action fire" id="fire">FIRE</button></div></div><div class="overlay hidden" id="over"><div class="result"><h2 id="overTitle">MISSION COMPLETE</h2><p id="overText"></p><button type="button" class="btn" id="retry">Play Again</button><button type="button" class="btn" id="menuBtn">Main Menu</button></div></div><div class="bottom-info" id="info">Loading battlefield engine…</div><div class="load-error hidden" id="loadError"></div></section></main></div><script type="module">const $=id=>document.getElementById(id);let game,net,soundOn=true,roomMode=false;const fail=e=>{console.error('NEON RIFT',e);$('loadError').textContent='Battlefield engine failed to load. Please refresh once.';$('loadError').classList.remove('hidden');$('status').textContent='Engine error — refresh to retry';$('info').textContent='Engine failed to start.'};(async()=>{try{const M=await import('./neon-rift.js?v=2'),N=await import('./neon-rift-network.js?v=2');game=new M.BattleGame($('canvas'));net=new N.RiftNetwork();$('info').textContent=M.detectInputMode()==='desktop'?'WASD / arrows • Space jetpack • mouse aim/fire • G grenade':'Joystick • JET • FIRE • 💣 grenade';const tone=(f=420,d=.06)=>{if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=window.__a||(window.__a=new C);c.resume?.();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='square';g.gain.value=.025;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}};const start=m=>{if(!game)return;$('menu').classList.add('hidden');$('over').classList.add('hidden');$('modeHud').textContent=m.toUpperCase();game.start(m);tone(620,.1)};document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));$('retry').addEventListener('click',()=>start(game.mode));$('menuBtn').addEventListener('click',()=>{$('over').classList.add('hidden');$('menu').classList.remove('hidden')});$('fs').addEventListener('click',()=>document.documentElement.requestFullscreen?.());$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound':'🔇 Sound'});game.onEnd=r=>{$('over').classList.remove('hidden');$('overTitle').textContent=r.reason;$('overText').textContent=`${r.kills} kills • ${r.score} score • ${Math.floor(r.time)} seconds`;tone(180,.2);navigator.vibrate?.([40,30,80])};$('hostBtn').addEventListener('click',async()=>{try{const id=await net.host();roomMode=true;$('status').textContent='Room created: '+id;start('deathmatch')}catch(e){$('status').textContent='Room unavailable — starting solo deathmatch';start('deathmatch')}});$('joinBtn').addEventListener('click',async()=>{const id=prompt('Enter room code');if(!id)return;try{await net.join(id.trim());roomMode=true;$('status').textContent='Connected: '+id;start('deathmatch')}catch(e){$('status').textContent='Could not join — starting solo deathmatch';start('deathmatch')}});net.onPeers=n=>{if(roomMode)$('status').textContent='Room connected • '+(n+1)+' player'+(n?'s':'')};const joy=$('joy'),stick=$('stick');let jid=null;const move=e=>{const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.34,l=Math.min(max,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),x=Math.cos(a)*l,y=Math.sin(a)*l;stick.style.transform=`translate(${x}px,${y}px)`;game.touch.moveX=x/max;game.touch.moveY=y/max;game.touch.aimX=.7;game.touch.aimY=.5};joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);move(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)move(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,()=>{jid=null;stick.style.transform='translate(0,0)';game.touch.moveX=0;game.touch.moveY=0}));$('fire').addEventListener('pointerdown',()=>{game.touch.fire=true;tone(520,.04);navigator.vibrate?.(7)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fire').addEventListener(ev,()=>game.touch.fire=false));$('jet').addEventListener('pointerdown',()=>{game.touch.jet=true;navigator.vibrate?.(8)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('jet').addEventListener(ev,()=>game.touch.jet=false));$('grenade').addEventListener('pointerdown',()=>{game.throwGrenade();tone(260,.07);navigator.vibrate?.(12)});setInterval(()=>{if(game)$('stats').textContent=`KILLS ${game.kills} • SCORE ${game.score} • HP ${Math.max(0,Math.round(game.player?.hp||0))}`},120)}catch(e){fail(e)}})();</script></body></html>
